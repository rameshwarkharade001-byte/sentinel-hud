<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENTINEL-X9 // APEX AUTONOMOUS HUD</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --neon-blue: #00f2fe;
      --neon-red: #ff003c;
      --neon-green: #00ff66;
      --neon-yellow: #ffb703;
      --panel-bg: rgba(6, 11, 25, 0.75);
    }
    body {
      background: radial-gradient(circle at center, #0a1128 0%, #02040a 100%);
      color: var(--neon-blue);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 6px;
      overflow-x: hidden;
      user-select: none;
    }
    #flashOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #fff; opacity: 0; pointer-events: none; z-index: 999;
      transition: opacity 0.04s ease;
    }
    .strobe-active { opacity: 0.9 !important; background: var(--neon-red) !important; }

    .hud-topbar {
      width: 100%; max-width: 480px; display: flex; justify-content: space-between;
      align-items: center; padding: 6px 14px;
      background: var(--panel-bg); border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 8px; backdrop-filter: blur(10px); margin-bottom: 6px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
    }
    .hud-title { font-size: 15px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 10px var(--neon-blue); }
    .hud-status-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--neon-green); color: var(--neon-green); }

    .viewport-box {
      position: relative; width: 100%; max-width: 480px; height: 430px;
      border-radius: 12px; overflow: hidden; background: #000;
      border: 2px solid var(--neon-blue);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
    }
    video, canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    .night-vision-mode video {
      filter: brightness(1.2) contrast(1.4) hue-rotate(90deg) saturate(2);
    }

    .crosshair-reticle {
      position: absolute; top: 50%; left: 50%; width: 180px; height: 180px;
      transform: translate(-50%, -50%); border: 1px dashed rgba(0, 242, 254, 0.35);
      border-radius: 50%; pointer-events: none;
    }
    .scanner-beam {
      position: absolute; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
      box-shadow: 0 0 8px var(--neon-blue);
      animation: scanAnim 2.5s infinite linear; pointer-events: none;
    }
    @keyframes scanAnim {
      0% { top: 0; opacity: 0; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .cluster-grid {
      width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 6px; margin-top: 6px;
    }
    .cluster-card {
      background: var(--panel-bg); border: 1px solid rgba(0, 242, 254, 0.25);
      padding: 8px 10px; border-radius: 8px; text-align: center;
      backdrop-filter: blur(8px);
    }
    .cluster-val { font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--neon-blue); }
    .cluster-lbl { font-size: 9px; opacity: 0.7; letter-spacing: 1px; }

    .rpm-container {
      width: 100%; max-width: 480px; height: 10px; background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,242,254,0.3); border-radius: 6px; margin-top: 6px;
      overflow: hidden; display: flex; gap: 2px; padding: 1px;
    }
    .rpm-bar { height: 100%; flex: 1; background: rgba(0, 242, 254, 0.15); border-radius: 1px; }
    .rpm-bar.active { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
    .rpm-bar.warning { background: var(--neon-yellow); box-shadow: 0 0 6px var(--neon-yellow); }
    .rpm-bar.danger { background: var(--neon-red); box-shadow: 0 0 6px var(--neon-red); }

    .btn-row {
      width: 100%; max-width: 480px; display: flex; gap: 6px; margin-top: 8px;
    }
    .tactical-btn {
      flex: 1; padding: 12px; background: rgba(0, 242, 254, 0.08);
      border: 1px solid var(--neon-blue); color: var(--neon-blue);
      font-weight: 900; font-size: 12px; letter-spacing: 2px;
      border-radius: 6px; cursor: pointer; transition: 0.2s;
    }
    .tactical-btn:active { background: var(--neon-blue); color: #000; }
    .btn-nv { border-color: var(--neon-green); color: var(--neon-green); }

    .credit-tag {
      margin-top: 10px; font-size: 10px; letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.6);
    }
    .credit-tag span { color: var(--neon-blue); font-weight: bold; }
  </style>
</head>
<body>

  <div id="flashOverlay"></div>

  <div class="hud-topbar">
    <div class="hud-title">SENTINEL-X9</div>
    <div class="hud-status-badge" id="sysState">ONLINE // STANDBY</div>
  </div>

  <div class="viewport-box" id="viewport">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="telemetryCanvas"></canvas>
    <div class="crosshair-reticle"></div>
    <div class="scanner-beam"></div>
  </div>

  <div class="rpm-container" id="rpmStrip"></div>

  <div class="cluster-grid">
    <div class="cluster-card">
      <div class="cluster-val" id="speedVal">0</div>
      <div class="cluster-lbl">VELOCITY (KM/H)</div>
    </div>
    <div class="cluster-card">
      <div class="cluster-val" id="gearVal" style="color:var(--neon-yellow);">DRIVE [D]</div>
      <div class="cluster-lbl">TRANSMISSION</div>
    </div>
    <div class="cluster-card">
      <div class="cluster-val" id="earVal">0.00</div>
      <div class="cluster-lbl">OCULAR RATIO (EAR)</div>
    </div>
  </div>

  <div class="cluster-grid">
    <div class="cluster-card">
      <div class="cluster-val" id="yawnCount">0</div>
      <div class="cluster-lbl">YAWN DETECTIONS</div>
    </div>
    <div class="cluster-card">
      <div class="cluster-val" id="vigilanceScore" style="color:var(--neon-green);">100%</div>
      <div class="cluster-lbl">VIGILANCE INDEX</div>
    </div>
    <div class="cluster-card">
      <div class="cluster-val" id="fpsVal">0</div>
      <div class="cluster-lbl">NEURAL FPS</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="tactical-btn" id="startBtn">ENGAGE APEX CORE</button>
    <button class="tactical-btn btn-nv" id="nvBtn">THERMAL / NV</button>
  </div>

  <div class="credit-tag">
    LEAD ARCHITECT: <span>RAMESHWAR KHARADE</span>
  </div>
    <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('telemetryCanvas');
    const ctx = canvas.getContext('2d');
    const flashOverlay = document.getElementById('flashOverlay');
    const startBtn = document.getElementById('startBtn');
    const nvBtn = document.getElementById('nvBtn');
    const viewport = document.getElementById('viewport');

    let audioCtx, isRunning = false, nightVision = false;
    let yawns = 0, lastYawnTime = 0, closedEyeFrames = 0;
    let lastFrameTime = performance.now(), fps = 0;

    // RPM 24 Gauge Segments
    const rpmStrip = document.getElementById('rpmStrip');
    for (let i = 0; i < 24; i++) {
      const bar = document.createElement('div');
      bar.className = 'rpm-bar';
      rpmStrip.appendChild(bar);
    }
    const rpmBars = document.querySelectorAll('.rpm-bar');

    function updateRpm(ratio) {
      const activeCount = Math.floor(ratio * rpmBars.length);
      rpmBars.forEach((bar, idx) => {
        bar.className = 'rpm-bar';
        if (idx < activeCount) {
          if (idx > 18) bar.classList.add('danger', 'active');
          else if (idx > 13) bar.classList.add('warning', 'active');
          else bar.classList.add('active');
        }
      });
    }

    // Audio Engine
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function triggerSawtoothAlarm() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function speakAlert(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'mr-IN';
        msg.rate = 1.1;
        window.speechSynthesis.speak(msg);
      }
    }

    function distance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function getEAR(landmarks) {
      const leftV1 = distance(landmarks[160], landmarks[144]);
      const leftV2 = distance(landmarks[158], landmarks[153]);
      const leftH = distance(landmarks[33], landmarks[133]);
      const leftEAR = (leftV1 + leftV2) / (2.0 * leftH);

      const rightV1 = distance(landmarks[385], landmarks[380]);
      const rightV2 = distance(landmarks[387], landmarks[373]);
      const rightH = distance(landmarks[362], landmarks[263]);
      const rightEAR = (rightV1 + rightV2) / (2.0 * rightH);

      return (leftEAR + rightEAR) / 2.0;
    }

    function getMAR(landmarks) {
      const v = distance(landmarks[13], landmarks[14]);
      const h = distance(landmarks[78], landmarks[308]);
      return v / h;
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    faceMesh.onResults((results) => {
      const now = performance.now();
      fps = Math.round(1000 / (now - lastFrameTime));
      lastFrameTime = now;
      document.getElementById('fpsVal').innerText = fps;

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const ear = getEAR(landmarks);
        const mar = getMAR(landmarks);

        document.getElementById('earVal').innerText = ear.toFixed(2);
        document.getElementById('speedVal').innerText = Math.floor(75 + Math.sin(now/1000) * 8);
        updateRpm(Math.min(1, ear * 3.5));

        const leftEye = landmarks[133];
        const rightEye = landmarks[362];
        const cx = ((leftEye.x + rightEye.x) / 2) * canvas.width;
        const cy = ((leftEye.y + rightEye.y) / 2) * canvas.height;

        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 65, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.strokeRect(cx - 80, cy - 60, 160, 120);

        if (ear < 0.21) {
          closedEyeFrames++;
          if (closedEyeFrames > 12) {
            flashOverlay.classList.add('strobe-active');
            triggerSawtoothAlarm();
            document.getElementById('sysState').innerText = "CRITICAL // SLEEP INTERCEPT";
            document.getElementById('sysState').style.borderColor = "#ff003c";
            document.getElementById('sysState').style.color = "#ff003c";
            document.getElementById('vigilanceScore').innerText = "ALERT!";
            document.getElementById('vigilanceScore').style.color = "#ff003c";
            if (closedEyeFrames === 15) {
              speakAlert("अरे उठ रे! डोळे उघडे ठेव!");
            }
          }
        } else {
          closedEyeFrames = 0;
          flashOverlay.classList.remove('strobe-active');
          document.getElementById('sysState').innerText = "TRACKING // OPTIMAL";
          document.getElementById('sysState').style.borderColor = "#00ff66";
          document.getElementById('sysState').style.color = "#00ff66";
          document.getElementById('vigilanceScore').innerText = "98%";
          document.getElementById('vigilanceScore').style.color = "#00ff66";
        }

        if (mar > 0.65 && (now - lastYawnTime) > 3500) {
          yawns++;
          lastYawnTime = now;
          document.getElementById('yawnCount').innerText = yawns;
          triggerSawtoothAlarm();
          speakAlert("जांभई डिटेक्ट झाली! थकवा जाणवतोय!");
        }
      } else {
        document.getElementById('sysState').innerText = "OPERATOR LOST // ACQUIRING";
        document.getElementById('sysState').style.borderColor = "#ffb703";
        document.getElementById('sysState').style.color = "#ffb703";
        updateRpm(0.1);
      }
      ctx.restore();
    });

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' }
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      async function processLoop() {
        if (isRunning) {
          await faceMesh.send({ image: video });
          requestAnimationFrame(processLoop);
        }
      }
      processLoop();
    }

    startBtn.addEventListener('click', () => {
      initAudio();
      if (!isRunning) {
        isRunning = true;
        initCamera();
        startBtn.innerText = "SYSTEM ACTIVE";
        startBtn.style.background = "#00ff66";
        startBtn.style.color = "#000";
      }
    });

    nvBtn.addEventListener('click', () => {
      nightVision = !nightVision;
      if (nightVision) {
        viewport.classList.add('night-vision-mode');
        nvBtn.innerText = "NORMAL OPTICS";
      } else {
        viewport.classList.remove('night-vision-mode');
        nvBtn.innerText = "THERMAL / NV";
      }
    });
  </script>
</body>
</html>
