<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SENTINEL-X9 PRO // AUTONOMOUS AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    :root {
      --bg: #020813;
      --panel: #06152b;
      --card: rgba(8, 24, 48, 0.95);
      --cyan: #00f2fe;
      --green: #00ff66;
      --red: #ff003c;
      --yellow: #ffb703;
      --border: rgba(0, 242, 254, 0.28);
    }
    body { background: var(--bg); color: #e2f1ff; width: 100%; min-height: 100vh; padding: 8px; overflow-x: hidden; user-select: none; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    .brand { font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #fff; }
    .brand span { color: var(--cyan); }
    .sys-badge { background: rgba(0,255,102,0.15); border: 1px solid var(--green); color: var(--green); padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: bold; }

    .tab-bar { display: flex; gap: 6px; margin-bottom: 8px; }
    .tab-btn { flex: 1; padding: 8px 4px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; font-weight: bold; color: #8ba9c9; cursor: pointer; text-align: center; }
    .tab-btn.active { background: rgba(0,242,254,0.18); border-color: var(--cyan); color: #fff; }

    .cam-box { position: relative; width: 100%; height: 280px; background: #000; border: 2px solid var(--cyan); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
    #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events: none; }
    .cam-meta-top { position: absolute; top: 6px; left: 8px; right: 8px; display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; color: var(--green); pointer-events: none; z-index: 2; }
    .cam-meta-bot { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(2,8,19,0.92); border-top: 1px solid var(--border); padding: 6px 10px; display: flex; justify-content: space-between; font-size: 11px; z-index: 2; }

    .metric-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .m-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; }
    .m-val { font-size: 16px; font-weight: 900; color: #fff; }
    .m-lbl { font-size: 8px; opacity: 0.7; letter-spacing: 0.5px; margin-top: 2px; }

    .alarm-box { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
    .vol-btn { width: 30px; height: 30px; background: #000; border: 1px solid var(--cyan); color: var(--cyan); font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; }

    .graph-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .graph-title { font-size: 10px; font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; color: var(--cyan); }
    #graphCanvas { display: block; width: 100%; height: 60px; background: rgba(0,0,0,0.5); border-radius: 4px; border: 1px solid rgba(0,242,254,0.15); }

    .btn-row { display: flex; gap: 6px; margin-top: 4px; }
    .main-btn { flex: 2; padding: 14px; background: rgba(0,242,254,0.15); border: 2px solid var(--cyan); border-radius: 8px; color: var(--cyan); font-size: 13px; font-weight: 900; letter-spacing: 1px; cursor: pointer; }
    .opt-sel { flex: 1; padding: 12px 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--cyan); font-size: 11px; font-weight: bold; outline: none; }

    #flashOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--red); opacity: 0; pointer-events: none; z-index: 999; }
    .strobe { opacity: 0.85 !important; }
  </style>
</head>
<body>
  <div id="flashOverlay"></div>

  <header class="topbar">
    <div class="brand">SENTINEL-X9 <span>PRO</span></div>
    <div class="sys-badge" id="badgeStatus">● ACTIVE 2.0</div>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" id="tab1">📊 DASHBOARD</button>
    <button class="tab-btn" id="tab2">📈 STATISTICS</button>
    <button class="tab-btn" id="tab3">🔔 ALERTS (<span id="alertCountBadge">0</span>)</button>
  </nav>

  <div class="cam-box">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="cam-meta-top">
      <span>● LIVE AI FEED</span>
      <span>CAM: FRONT HD</span>
    </div>
    <div class="cam-meta-bot">
      <span id="eyeStateTxt" style="color:var(--green); font-weight:bold;">👁️ EYES OPEN</span>
      <span>EAR: <b id="earVal" style="color:var(--cyan);">0.22</b></span>
      <span>SCORE: <b id="scoreVal" style="color:var(--green);">18/100</b></span>
    </div>
  </div>

  <div class="metric-row">
    <div class="m-card">
      <div class="m-val" id="timerTxt">00:00</div>
      <div class="m-lbl">SESSION TIME</div>
    </div>
    <div class="m-card">
      <div class="m-val" id="totalAlertsVal">0</div>
      <div class="m-lbl">TOTAL ALERTS</div>
    </div>
    <div class="m-card">
      <div class="m-val" id="drowsyEventsVal" style="color:var(--green);">0</div>
      <div class="m-lbl">DROWSY EVENTS</div>
    </div>
  </div>

  <div class="alarm-box">
    <div>
      <div style="font-size:11px; font-weight:bold; color:var(--green);">🔊 ALARM: REAL SIREN ACTIVE</div>
      <div style="font-size:9px; opacity:0.7;">VOL: <span id="volTxt">100%</span></div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="vol-btn" onclick="adjustVol(-20)">-</button>
      <button class="vol-btn" onclick="adjustVol(20)">+</button>
    </div>
  </div>

  <div class="graph-box">
    <div class="graph-title">DROWSINESS TELEMETRY GRAPH (REAL-TIME)</div>
    <canvas id="graphCanvas" width="360" height="60"></canvas>
  </div>

  <div class="btn-row">
    <select class="opt-sel" id="sensSelect">
      <option value="med">SENSITIVITY: MED</option>
      <option value="high">SENSITIVITY: HIGH</option>
      <option value="low">SENSITIVITY: LOW</option>
    </select>
    <button class="main-btn" id="startBtn">🎯 ENGAGE TRACKING</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const graphCanvas = document.getElementById('graphCanvas');
    const gCtx = graphCanvas.getContext('2d');
    const flashOverlay = document.getElementById('flashOverlay');
    const startBtn = document.getElementById('startBtn');
    const eyeStateTxt = document.getElementById('eyeStateTxt');
    const earVal = document.getElementById('earVal');
    const scoreVal = document.getElementById('scoreVal');
    const timerTxt = document.getElementById('timerTxt');
    const totalAlertsVal = document.getElementById('totalAlertsVal');
    const drowsyEventsVal = document.getElementById('drowsyEventsVal');
    const alertCountBadge = document.getElementById('alertCountBadge');
    const volTxt = document.getElementById('volTxt');
    const sensSelect = document.getElementById('sensSelect');

    let isTracking = false;
    let audioCtx = null;
    let volumeLevel = 1.0;
    let elapsedSec = 0;
    let timerInterval = null;
    let totalAlerts = 0;
    let drowsyEvents = 0;
    let closedFrames = 0;
    let earThreshold = 0.18;
    let frameTrigger = 8;
    let graphData = [15, 18, 16, 20, 18, 17, 19, 18, 22, 18, 16, 18];

    function drawGraph(newVal) {
      graphData.push(newVal);
      if (graphData.length > 30) graphData.shift();

      gCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
      gCtx.strokeStyle = 'rgba(0, 242, 254, 0.15)';
      gCtx.lineWidth = 1;
      for (let y = 15; y < 60; y += 15) {
        gCtx.beginPath();
        gCtx.moveTo(0, y);
        gCtx.lineTo(graphCanvas.width, y);
        gCtx.stroke();
      }

      gCtx.strokeStyle = '#00ff66';
      gCtx.lineWidth = 2;
      gCtx.beginPath();
      const step = graphCanvas.width / (graphData.length - 1);
      graphData.forEach((pt, i) => {
        const x = i * step;
        const y = 55 - (pt * 0.5);
        if (i === 0) gCtx.moveTo(x, y);
        else gCtx.lineTo(x, y);
      });
      gCtx.stroke();

      const lastX = (graphData.length - 1) * step;
      const lastY = 55 - (newVal * 0.5);
      gCtx.fillStyle = '#00f2fe';
      gCtx.beginPath();
      gCtx.arc(lastX, lastY, 3, 0, Math.PI * 2);
      gCtx.fill();
    }
    drawGraph(18);

    function initAudioEngine() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    window.adjustVol = function(d) {
      volumeLevel = Math.max(0, Math.min(1, volumeLevel + (d / 100)));
      volTxt.innerText = Math.round(volumeLevel * 100) + '%';
    };

    function soundLoudSiren() {
      if (!audioCtx || volumeLevel === 0) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(950, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.22);
      gain.gain.setValueAtTime(volumeLevel * 0.7, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    sensSelect.addEventListener('change', (e) => {
      if (e.target.value === 'high') { earThreshold = 0.20; frameTrigger = 6; }
      else if (e.target.value === 'low') { earThreshold = 0.16; frameTrigger = 14; }
      else { earThreshold = 0.18; frameTrigger = 8; }
    });

    function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

    function getEAR(lm) {
      const lv1 = dist(lm[160], lm[144]), lv2 = dist(lm[158], lm[153]), lh = dist(lm[33], lm[133]);
      const rv1 = dist(lm[385], lm[380]), rv2 = dist(lm[387], lm[373]), rh = dist(lm[362], lm[263]);
      return ((lv1 + lv2) / (2.0 * lh) + (rv1 + rv2) / (2.0 * rh)) / 2.0;
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    faceMesh.onResults((results) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const lm = results.multiFaceLandmarks[0];
        const ear = getEAR(lm);
        earVal.innerText = ear.toFixed(2);

        let minX = 1, maxX = 0, minY = 1, maxY = 0;
        lm.forEach(p => {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        });

        const fx = minX * canvas.width, fy = minY * canvas.height;
        const fw = (maxX - minX) * canvas.width, fh = (maxY - minY) * canvas.height;

        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 1.8;
        ctx.strokeRect(fx - 6, fy - 10, fw + 12, fh + 16);

        const lx = lm[33].x * canvas.width, ly = lm[158].y * canvas.height;
        const lw = (lm[133].x - lm[33].x) * canvas.width;
        const rx = lm[362].x * canvas.width, ry = lm[387].y * canvas.height;
        const rw = (lm[263].x - lm[362].x) * canvas.width;

        ctx.strokeRect(lx - 4, ly - 4, lw + 8, 22);
        ctx.strokeRect(rx - 4, ry - 4, rw + 8, 22);

        if (ear < earThreshold) {
          closedFrames++;
          eyeStateTxt.innerText = "⚠️ EYES CLOSED";
          eyeStateTxt.style.color = "var(--red)";

          const dScore = Math.min(98, 35 + (closedFrames * 7));
          scoreVal.innerText = dScore + "/100";
          scoreVal.style.color = "var(--red)";
          drawGraph(dScore);

          if (closedFrames > frameTrigger) {
            flashOverlay.classList.add('strobe');
            soundLoudSiren();

            if (closedFrames === frameTrigger + 1) {
              drowsyEvents++;
              totalAlerts++;
              drowsyEventsVal.innerText = drowsyEvents;
              totalAlertsVal.innerText = totalAlerts;
              alertCountBadge.innerText = totalAlerts;
              drowsyEventsVal.style.color = "var(--red)";
            }
          }
        } else {
          closedFrames = 0;
          flashOverlay.classList.remove('strobe');
          eyeStateTxt.innerText = "👁️ EYES OPEN";
          eyeStateTxt.style.color = "var(--green)";
          scoreVal.innerText = "18/100";
          scoreVal.style.color = "var(--green)";
          if (Math.random() > 0.8) drawGraph(Math.floor(16 + Math.random() * 5));
        }
      }
    });

    async function launchApp() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' }
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      timerInterval = setInterval(() => {
        elapsedSec++;
        const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const s = String(elapsedSec % 60).padStart(2, '0');
        timerTxt.innerText = `${m}:${s}`;
      }, 1000);

      async function loop() {
        if (isTracking) {
          await faceMesh.send({ image: video });
          requestAnimationFrame(loop);
        }
      }
      loop();
    }

    startBtn.addEventListener('click', () => {
      initAudioEngine();
      isTracking = !isTracking;

      if (isTracking) {
        launchApp();
        startBtn.innerText = "🛑 DISENGAGE TRACKING";
        startBtn.style.borderColor = "var(--red)";
        startBtn.style.color = "var(--red)";
      } else {
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        clearInterval(timerInterval);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        startBtn.innerText = "🎯 ENGAGE TRACKING";
        startBtn.style.borderColor = "var(--cyan)";
        startBtn.style.color = "var(--cyan)";
      }
    });
  </script>
</body>
</html>
